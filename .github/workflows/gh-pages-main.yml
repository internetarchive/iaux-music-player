# This workflow will generate the static page under `main` subdirectory inside the `gh-pages` branch

# This workflow will run every time new changes were pushed to the `main` branch

name: App build CI/CD to main branch

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create build files for gh-pages deploy
        run: npm run ghpages:build

      # Reference: https://github.com/JamesIves/github-pages-deploy-action
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: ghpages
          clean-exclude: pr/
          force: false
          target-folder: main

      # The gh-pages branch root has no index.html of its own, so this keeps
      # https://internetarchive.github.io/iaux-music-player/ redirecting to
      # the main demo. clean: false leaves main/ and pr/ untouched.
      - name: Deploy root redirect 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: .github/gh-pages-root
          clean: false
          force: false
